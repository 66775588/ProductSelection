[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dianshang"
version = "0.1.0"
description = "电商选品调研 Agent —— 自动化全链路选品决策（市场/竞品/痛点/利润/风险 → 评估报告）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dianshang" }]
dependencies = [
    "langgraph>=0.2.0",
    "zhipuai>=2.1.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "portalocker>=2.8.0",
]

[project.scripts]
dianshang = "dianshang.cli:main"
dianshang-web = "dianshang.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
